services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_BASE_URL=https://apihub.agnes-ai.com/v1
      - LLM_MODEL=agnes-2.0-flash
      - EMBEDDING_MODEL=BAAI/bge-small-zh-v1.5
    volumes:
      - chroma_data:/app/chroma_db
      - diary_data:/app/diaries

volumes:
  chroma_data:
  diary_data:
